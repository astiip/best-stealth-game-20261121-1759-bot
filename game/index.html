<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mothlight — The Night Courier</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #05070f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }
  #stage {
    position: relative;
    width: 960px;
    height: 600px;
  }
  canvas {
    display: block;
    width: 960px;
    height: 600px;
    background: #0a1226;
    border: 1px solid #26355e;
    border-radius: 6px;
  }
  #hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -26px;
    text-align: center;
    color: #5f739e;
    font-size: 12px;
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="600"></canvas>
  <div id="hint">Mothlight — The Night Courier &middot; WASD / arrows to move &middot; Shift to sneak &middot; Space to duck in cover &middot; M to mute</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
